name: Controlli

on:
  push:
    branches: [main]
  pull_request:

# Controlli DIRETTIVE.md: tipi, confini/credenziali, build, test, smoke isolati e audit.
jobs:
  controlli:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/check-infrastructure.mjs
      - run: npm run build
      - run: node --import tsx --test tests/*.test.ts
      - run: python -I -m unittest discover -s database/script
      - run: node scripts/smoke-runtime.mjs
      - run: node scripts/smoke-runtime.mjs --bundle
      - run: npm audit --omit=dev
