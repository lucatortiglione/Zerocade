<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZeroDoppioSenso · Prova overlay</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#18191e;color:#fff;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{display:flex;align-items:center;justify-content:center;gap:36px;padding:18px;flex-wrap:wrap}
#stage{--ink:#fff3dc;--accent:#ffcb71;--line:#806854;background:radial-gradient(ellipse at 12% 3%,#66342e,transparent 50%),linear-gradient(150deg,#261d2a,#100f20 75%);color:var(--ink);width:min(92vw,43vh,430px);aspect-ratio:9/16;padding:7% 5%;padding:5cqw;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;container-type:inline-size;border-radius:12px;border:1px solid #7c726c}
#stage{padding:clamp(15px,2.8vh,32px)}#stage.arcade{--accent:#afff54;--ink:#dfffe9;--line:#477957;background:repeating-linear-gradient(0deg,transparent 0 5px,#09231d44 6px),linear-gradient(135deg,#113c37,#071714 68%);border-radius:0}
header,footer,.eyebrow{font-size:3.7cqw;font-weight:700;letter-spacing:.09em}header{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:4cqw}header span:last-child{color:var(--accent)}article{flex:1;display:flex;flex-direction:column;justify-content:center;gap:4cqw}.eyebrow{color:var(--accent);margin:0}h1{font:600 11cqw/1.04 Georgia,serif;margin:0;letter-spacing:-.045em}.arcade h1{font:800 9.8cqw/1.04 monospace;letter-spacing:-.055em}#second{min-height:4em;font-size:6cqw;line-height:1.26;margin:0;padding-top:3cqw;border-top:1px solid var(--line)}footer{letter-spacing:0}progress{width:100%;height:9px;accent-color:var(--accent);margin-top:8px}aside{width:min(92vw,290px)}h2{font-size:20px;margin:0 0 18px}button,select,input{font:inherit;padding:9px 12px;border:1px solid #787b88;border-radius:5px}button,select{cursor:pointer}button:disabled{opacity:.5;cursor:default}label{display:grid;gap:6px;margin:15px 0}form{margin:12px 0}input,select{width:100%}#feedback{min-height:2.6em;color:#efe2bd}
</style>
<main>
<section id="stage" aria-label="Anteprima verticale">
<header><span>ZEROCADE</span><span>ROUND 12 / 50</span></header>
<article><p class="eyebrow" id="headline">ZERODOPPIOSENSO</p><h1 id="first">Il capitano la solleva dopo la finale.</h1><p id="second" aria-live="polite">Secondo indizio · · ·</p></article>
<footer><span id="caption">Fai tap per scoprire prima il prossimo indizio</span><progress id="meter" max="1" value="0" aria-label="Prossimo frammento"></progress></footer>
</section>
<aside><h2>Prova il round</h2><label>Stile dell’overlay<select id="theme"><option>Quiz serale</option><option>Arcade tipografico</option></select></label>
<button id="tap" type="button">Simula tap tap</button>
<form><label>Risposta dalla chat<input id="guess" autocomplete="off" required></label><button id="send">Invia risposta</button></form>
<p id="feedback" role="status"></p><button id="reset" type="button">Ricomincia il round</button></aside></main>
<script>
const byId = id => document.getElementById(id);
const pieces = ['Dal salumiere', 'si ordina a etti', 'e si affetta sottile.'];
const automaticMs = 15000, minimumMs = 3000, tapCreditMs = 1500;
let shown, credit, lastReveal, won;
function resetRound() {
  shown = 0; credit = 0; lastReveal = performance.now(); won = false;
  byId('headline').textContent = 'ZERODOPPIOSENSO';
  byId('first').textContent = 'Il capitano la solleva dopo la finale.';
  byId('second').textContent = 'Secondo indizio · · ·';
  byId('caption').textContent = 'Fai tap per scoprire prima il prossimo indizio';
  byId('meter').hidden = false; byId('meter').value = 0;
  for (const id of ['tap','guess','send']) byId(id).disabled = false;
  byId('feedback').textContent = ''; byId('guess').value = '';
}
function update(now) {
  if (won || shown === pieces.length) return;
  const elapsed = now - lastReveal;
  byId('meter').value = Math.min(1, (elapsed + credit) / automaticMs);
  if (elapsed < minimumMs || elapsed + credit < automaticMs) return;
  credit = Math.max(0, credit - Math.max(0, automaticMs - elapsed));
  lastReveal = now; shown += 1;
  byId('second').textContent = pieces.slice(0, shown).join(' ') + (shown < pieces.length ? '…' : '');
  byId('meter').value = Math.min(1,credit / automaticMs);
  if (shown === pieces.length) {
    byId('tap').disabled = true; byId('meter').hidden = true;
    byId('caption').textContent = 'Scrivi la parola in chat';
  }
}
byId('theme').onchange = e => byId('stage').classList.toggle('arcade', e.target.selectedIndex === 1);
byId('tap').onclick = () => { credit += tapCreditMs; update(performance.now()); };
byId('reset').onclick = resetRound;
document.querySelector('form').onsubmit = e => {
  e.preventDefault(); if (won) return;
  const guess = byId('guess').value.trim().toLocaleLowerCase('it');
  if (guess !== 'coppa') { byId('feedback').textContent = 'Puoi tentare ancora.'; byId('guess').select(); return; }
  won = true; byId('headline').textContent = 'HAI INDOVINATO'; byId('first').textContent = 'COPPA';
  byId('second').textContent = 'Il capitano la solleva dopo la finale. ' + pieces.join(' ');
  byId('caption').textContent = 'Primo in chat · +1 punto'; byId('meter').hidden = true;
  for (const id of ['tap','guess','send']) byId(id).disabled = true;
  byId('feedback').textContent = 'Round concluso.';
};
resetRound(); setInterval(() => update(performance.now()), 100);
</script>
</html>
