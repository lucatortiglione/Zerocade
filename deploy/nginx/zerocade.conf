# Classifiche di Zerocade sulla VM Linux: file statici che il PC carica via SFTP (ZEROCADE_PUBLISH_TARGET).
# Installazione: copiare in /etc/nginx/sites-available/zerocade, collegare in sites-enabled, `nginx -t`, reload.
# Con questo come sito predefinito della porta 80, il link `default` di sites-enabled va tolto (il file resta).

# Aggiornamento in tempo reale con Nchan (apt install libnginx-mod-nchan): il PC fa una POST a /pub/<gioco> a ogni
# cambio di classifica e nginx la inoltra subito ai browser collegati a /sub/<gioco> (SSE).
nchan_shared_memory_size 32M;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/zerocade;
    index index.html;

    # Solo le classifiche e la loro API in sola lettura: tutto il resto è 404.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; base-uri 'none'" always;

    location = / { return 302 /classifica/; }
    location = /classifica { return 302 /classifica/; }

    # /classifica/ (indice), /classifica/<gioco> (-> <gioco>.html), classifica.css, classifica.js.
    location /classifica/ {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; base-uri 'none'" always;
    }

    # Un JSON per gioco, senza estensione (la pagina chiede /api/leaderboard/<gioco>?limit=N: nginx ignora la query).
    location /api/leaderboard/ {
        default_type application/json;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Solo il PC di Zerocade può pubblicare (il suo IP LAN: se cambia, va cambiato qui).
    location ~ "^/pub/([a-z0-9-]{1,40})$" {
        allow 192.168.1.35;
        deny all;
        nchan_publisher;
        nchan_channel_id "lb-$1";
        nchan_message_buffer_length 1;    # l'ultima classifica resta per chi si collega dopo
        nchan_message_timeout 30d;
    }

    # I browser: un flusso SSE per gioco, in sola lettura, solo su canali già creati dal PC.
    location ~ "^/sub/([a-z0-9-]{1,40})$" {
        nchan_subscriber eventsource;
        nchan_channel_id "lb-$1";
        nchan_subscribe_existing_channels_only on;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / { return 404; }
}
